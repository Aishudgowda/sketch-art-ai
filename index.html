<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sketch Art AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 22px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #ccc;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px 15px;
    }

    .upload-box {
      background: white;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    input[type="file"] {
      margin: 20px 0;
      width: 100%;
      max-width: 400px;
    }

    #preview {
      display: none;
      width: 100%;
      max-width: 320px;
      max-height: 400px;
      margin: 20px auto;
      border-radius: 14px;
      object-fit: contain;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #generateBtn {
      background: #111;
      color: white;
    }

    #generateBtn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #status {
      margin: 20px 0;
      text-align: center;
      font-weight: bold;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      display: block;
    }

    .card h3 {
      margin: 15px 0 12px;
    }

    .download-btn {
      width: 100%;
      background: #e5e5e5;
      color: #111;
    }

    .lock-text {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }

    .price {
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>✏️ Sketch Art AI</h1>
  <p>Turn your photo into professional AI sketch art</p>
</header>

<div class="container">

  <div class="upload-box">

    <h2>Upload Your Photo</h2>

    <p>Choose one clear face photo</p>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
    >

    <img
      id="preview"
      alt="Your photo preview"
    >

    <br>

    <button
      id="generateBtn"
      type="button"
    >
      ✨ Generate 4 Sketches
    </button>

    <div id="status"></div>

  </div>

  <div id="results" class="results"></div>

</div>

<footer>
  © 2026 Sketch Art AI
</footer>


<script>

const API_URL =
  "https://sketch-art-ai-api.aishudgowda2004.workers.dev/api/generate";

const photoInput =
  document.getElementById("photoInput");

const preview =
  document.getElementById("preview");

const generateBtn =
  document.getElementById("generateBtn");

const status =
  document.getElementById("status");

const results =
  document.getElementById("results");


/* =========================
   PHOTO PREVIEW
========================= */

photoInput.addEventListener("change", function () {

const file = photoInput.files && photoInput.files[0];
  if (!file) {
    preview.removeAttribute("src");
    preview.style.display = "none";
    return;
  }

  if (!file.type.startsWith("image/")) {
    alert("Please select an image file.");
    this.value = "";
    preview.style.display = "none";
    return;
  }

  const reader = new FileReader();

  reader.onload = function (event) {

    preview.src = event.target.result;

    preview.style.display = "block";

    status.textContent = "";

    results.innerHTML = "";
  };

  reader.onerror = function () {

    preview.style.display = "none";

    status.textContent =
      "❌ Could not preview this photo.";
  };

  reader.readAsDataURL(file);

});


/* =========================
   RESIZE PHOTO
========================= */

async function resizeImage(file) {

  const bitmap =
    await createImageBitmap(file);

  const maxSize = 480;

  let width = bitmap.width;
  let height = bitmap.height;

  if (width > height) {

    if (width > maxSize) {

      height =
        Math.round(
          height * maxSize / width
        );

      width = maxSize;
    }

  } else {

    if (height > maxSize) {

      width =
        Math.round(
          width * maxSize / height
        );

      height = maxSize;
    }
  }

  const canvas =
    document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    bitmap,
    0,
    0,
    width,
    height
  );

  return new Promise(
    (resolve, reject) => {

      canvas.toBlob(
        blob => {

          if (!blob) {
            reject(
              new Error(
                "Could not process photo."
              )
            );

            return;
          }

          resolve(blob);
        },
        "image/jpeg",
        0.9
      );

    }
  );
}


/* =========================
   GENERATE SKETCHES
========================= */

generateBtn.addEventListener(
  "click",
  async function () {

    const file =
      photoInput.files &&
      photoInput.files[0];

    if (!file) {

      alert(
        "Please upload a photo first."
      );

      return;
    }

    generateBtn.disabled = true;

    status.textContent =
      "✨ Creating your 4 professional sketches...";

    results.innerHTML = "";

    try {

      const resizedPhoto =
        await resizeImage(file);

      const formData =
        new FormData();

      formData.append(
        "photo",
        resizedPhoto,
        "photo.jpg"
      );

      const response =
        await fetch(
          API_URL,
          {
            method: "POST",
            body: formData
          }
        );

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          data.error ||
          "Generation failed."
        );
      }

      status.textContent =
        "🎉 Your 4 sketches are ready!";

      showResults(
        data.images
      );

    } catch (error) {

      console.error(error);

      status.textContent =
        "❌ " +
        (
          error.message ||
          "Something went wrong."
        );

    } finally {

      generateBtn.disabled = false;
    }

  }
);


/* =========================
   SHOW RESULTS
========================= */

function showResults(images) {

  results.innerHTML = "";

  if (
    !images ||
    !images.length
  ) {

    status.textContent =
      "❌ No images were returned.";

    return;
  }

  images.forEach(
    function (item) {

      const card =
        document.createElement("div");

      card.className =
        "card";

      const image =
        document.createElement("img");

      image.src =
        item.image;

      image.alt =
        item.name;

      const title =
        document.createElement("h3");

      title.textContent =
        item.name;

      const button =
        document.createElement("button");

      button.className =
        "download-btn";

      button.type =
        "button";

      button.textContent =
        "🔒 Download — ₹99";

      button.onclick =
        function () {

          alert(
            "Download will be unlocked after ₹99 payment."
