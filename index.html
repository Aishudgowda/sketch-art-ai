<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>Sketch Art AI</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #ccc;
    }

    .container {
      width: min(100% - 28px, 900px);
      margin: 25px auto 50px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    .upload-box {
      border: 2px dashed #aaa;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
    }

    input[type="file"] {
      width: 100%;
      margin-top: 15px;
    }

    #preview {
      display: none;
      width: min(100%, 300px);
      max-height: 350px;
      object-fit: contain;
      margin: 20px auto 0;
      border-radius: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #generateBtn {
      width: 100%;
      margin-top: 20px;
      background: #000;
      color: #fff;
    }

    #status {
      text-align: center;
      margin-top: 18px;
      min-height: 24px;
      font-weight: bold;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .result {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 15px;
      padding: 12px;
      text-align: center;
    }

    .result img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .result h3 {
      font-size: 16px;
      margin: 12px 0 6px;
    }

    .locked {
      color: #777;
      font-size: 13px;
    }

    #paymentCard,
    #hdCard,
    #resultsCard {
      display: none;
    }

    #paymentCard {
      text-align: center;
      border: 2px solid #111;
    }

    .price {
      font-size: 32px;
      font-weight: bold;
      margin: 12px 0 18px;
    }

    #payBtn {
      width: 100%;
      max-width: 420px;
      background: #000;
      color: #fff;
    }

    .download {
      width: 100%;
      margin-top: 10px;
      background: #000;
      color: #fff;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 25px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 24px;
      }

      .results {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>✏️ Sketch Art AI</h1>
  <p>Turn your photo into professional AI sketch art</p>
</header>

<div class="container">

  <div class="card">

    <div class="upload-box">
      <h2>Upload Your Photo</h2>
      <p>Use one clear face photo for the best result.</p>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
      >

      <img
        id="preview"
        alt="Photo preview"
        draggable="false"
      >
    </div>

    <button id="generateBtn">
      ✨ Generate 4 Sketches
    </button>

    <div id="status"></div>

  </div>


  <div id="resultsCard" class="card">

    <h2>🎨 Your Sketches</h2>

    <div id="results" class="results"></div>

  </div>


  <div id="paymentCard" class="card">

    <h2>🔓 Unlock HD Downloads</h2>

    <p>
      Your 4 previews are ready.
    </p>

    <div class="price">₹99</div>

    <p>
      Pay ₹99 to generate and download all 4 HD sketches.
    </p>

    <button id="payBtn">
      💳 Pay ₹99 & Unlock HD
    </button>

  </div>


  <div id="hdCard" class="card">

    <h2>✨ Your HD Sketches</h2>

    <div id="hdResults" class="results"></div>

  </div>

</div>

<footer>
  © 2026 Sketch Art AI
</footer>


<script>

const API_URL =
  "https://sketch-art-ai-api.aishudgowda2004.workers.dev";


const photoInput =
  document.getElementById("photoInput");

const preview =
  document.getElementById("preview");

const generateBtn =
  document.getElementById("generateBtn");

const payBtn =
  document.getElementById("payBtn");

const statusBox =
  document.getElementById("status");

const resultsCard =
  document.getElementById("resultsCard");

const results =
  document.getElementById("results");

const paymentCard =
  document.getElementById("paymentCard");

const hdCard =
  document.getElementById("hdCard");

const hdResults =
  document.getElementById("hdResults");


let resizedPhoto = null;
let sessionId = null;
let photoHash = null;


/* Status */
function setStatus(text, error = false) {

  statusBox.textContent = text;

  statusBox.style.color =
    error ? "#d00000" : "#111";

}


/* Resize photo */
async function resizePhoto(file) {

  return new Promise((resolve, reject) => {

    const reader =
      new FileReader();

    reader.onload = () => {

      const img =
        new Image();

      img.onload = () => {

        const maxSize = 510;

        let width =
          img.naturalWidth;

        let height =
          img.naturalHeight;

        const scale =
          Math.min(
            1,
            maxSize /
              Math.max(
                width,
                height
              )
          );

        width =
          Math.round(
            width * scale
          );

        height =
          Math.round(
            height * scale
          );

        const canvas =
          document.createElement(
            "canvas"
          );

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext(
            "2d"
          );

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        canvas.toBlob(
          blob => {

            if (!blob) {

              reject(
                new Error(
                  "Photo processing failed."
                )
              );

              return;
            }

            resolve(
              new File(
                [blob],
                "photo.jpg",
                {
                  type:
                    "image/jpeg"
                }
              )
            );

          },
          "image/jpeg",
          0.9
        );

      };

      img.onerror = () => {

        reject(
          new Error(
            "Could not read photo."
          )
        );

      };

      img.src =
        reader.result;
    };

    reader.onerror = () => {

      reject(
        new Error(
          "Could not load photo."
        )
      );

    };

    reader.readAsDataURL(file);

  });

}


/* Preview uploaded photo */
photoInput.addEventListener(
  "change",
  () => {

    const file =
      photoInput.files[0];

    if (!file) {

      preview.style.display =
        "none";

      return;
    }

    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      setStatus(
        "Please select an image.",
        true
      );

      return;
    }

    preview.src =
      URL.createObjectURL(file);

    preview.style.display =
      "block";

    setStatus("");

  }
);


/*
  Generate 4 images in PARALLEL.
*/
generateBtn.addEventListener(
  "click",
  async () => {

    const file =
      photoInput.files[0];

    if (!file) {

      setStatus(
        "Please upload a photo first.",
        true
      );

      return;
    }

    try {

      generateBtn.disabled =
        true;

      payBtn.disabled =
        true;

      resultsCard.style.display =
        "none";

      paymentCard.style.display =
        "none";

      hdCard.style.display =
        "none";

      results.innerHTML =
        "";

      hdResults.innerHTML =
        "";

      setStatus(
        "⚡ Creating 4 AI sketches..."
      );


      resizedPhoto =
        await resizePhoto(file);


      sessionId =
        crypto.randomUUID();


      /*
        Send all 4 generation requests
        at the same time.
      */
      const requests =
        [0, 1, 2, 3].map(
          styleIndex =>
            generateOne(
              styleIndex
            )
        );


      const images =
        await Promise.all(
          requests
        );


      photoHash =
        images[0].photoHash;


      results.innerHTML =
        "";


      images
        .sort(
          (a, b) =>
            a.style -
            b.style
        )
        .forEach(item => {

          const box =
            document.createElement(
              "div"
            );

          box.className =
            "result";

          const image =
            document.createElement(
              "img"
            );

          image.src =
            item.image;

          image.alt =
            item.name;

          image.draggable =
            false;

          const title =
            document.createElement(
              "h3"
            );

          title.textContent =
            item.name;

          const locked =
            document.createElement(
              "div"
            );

          locked.className =
            "locked";

          locked.textContent =
            "🔒 HD download locked";

          box.appendChild(
            image
          );

          box.appendChild(
            title
          );

          box.appendChild(
            locked
          );

          results.appendChild(
            box
          );

        });


      resultsCard.style.display =
        "block";

      paymentCard.style.display =
        "block";

      payBtn.disabled =
        false;

      setStatus(
        "✅ 4 sketches created. Pay ₹99 to unlock HD downloads."
      );


    } catch (error) {

      console.error(error);

      setStatus(
        error?.message ||
        "Sketch generation failed.",
        true
      );

    } finally {

      generateBtn.disabled =
        false;

    }

  }
);


/*
  One preview request.
*/
async function generateOne(
  styleIndex
) {

  const form =
    new FormData();

  form.append(
    "photo",
    resizedPhoto,
    "photo.jpg"
  );

  form.append(
    "style",
    String(styleIndex)
  );

  form.append(
    "sessionId",
    sessionId
  );


  const response =
    await fetch(
      API_URL +
      "/api/generate-one",
      {
        method: "POST",
        body: form
      }
    );


  const data =
    await response.json();


  if (
    !response.ok ||
    !data.success
  ) {

    throw new Error(
      data.error ||
      "AI generation failed."
    );

  }


  return {
    style:
      styleIndex,

    name:
      data.name,

    image:
      data.image,

    photoHash:
      data.photoHash
  };

}


/*
  Pay ₹99.
*/
payBtn.addEventListener(
  "click",
  async () => {

    if (
      !sessionId ||
      !photoHash ||
      !resizedPhoto
    ) {

      setStatus(
        "Please generate the sketches again.",
        true
      );

      return;
    }


    try {

      payBtn.disabled =
        true;

      setStatus(
        "Opening secure payment..."
      );


      const response =
        await fetch(
          API_URL +
          "/api/create-order",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                sessionId,
                photoHash
              })
          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          data.error ||
          "Could not create payment order."
        );

      }


      if (
        typeof Razorpay ===
        "undefined"
      ) {

        throw new Error(
          "Razorpay could not load. Please refresh and try again."
        );

      }


      const options = {

        key:
          data.keyId,

        amount:
          data.amount,

        currency:
          data.currency,

        name:
          "Sketch Art AI",

        description:
          "Unlock 4 HD AI Sketches",

        order_id:
          data.orderId,


        handler:
          async payment => {

            await unlockHD(
              payment
            );

          },


        modal: {

          ondismiss:
            () => {

              payBtn.disabled =
                false;

              setStatus(
                "Payment window closed."
              );

            }

        },


        theme: {
          color: "#000000"
        }

      };


      const checkout =
        new Razorpay(
          options
        );


      checkout.on(
        "payment.failed",
        response => {

          console.error(
            response.error
          );

          payBtn.disabled =
            false;

          setStatus(
            response.error
              ?.description ||
            "Payment failed. Please try again.",
            true
          );

        }
      );


      checkout.open();


    } catch (error) {

      console.error(error);

      payBtn.disabled =
        false;

      setStatus(
        error?.message ||
        "Payment could not start.",
        true
      );

    }

  }
);


/*
  Payment verification + 4 HD
  requests in PARALLEL.
*/
async function unlockHD(
  payment
) {

  try {

    setStatus(
      "✅ Payment received. Creating 4 HD sketches..."
    );


    const requests =
      [0, 1, 2, 3].map(
        styleIndex =>
          generateHD(
            styleIndex,
            payment
          )
      );


    const images =
      await Promise.all(
        requests
      );


    hdResults.innerHTML =
      "";


    images
      .sort(
        (a, b) =>
          a.style -
          b.style
      )
      .forEach(item => {

        const box =
          document.createElement(
            "div"
          );

        box.className =
          "result";


        const image =
          document.createElement(
            "img"
          );

        image.src =
          item.image;

        image.alt =
          item.name;

        image.draggable =
          false;


        const title =
          document.createElement(
            "h3"
          );

        title.textContent =
          item.name;


        const download =
          document.createElement(
            "button"
          );

        download.className =
          "download";

        download.textContent =
          "⬇️ Download HD";


        download.onclick =
          () => {

            const link =
              document.createElement(
                "a"
              );

            link.href =
              item.image;

            link.download =
              "sketch-art-ai-" +
              item.name
                .toLowerCase()
                .replace(
                  /[^a-z0-9]+/g,
                  "-"
                ) +
              ".png";

            document.body.appendChild(
              link
            );

            link.click();

            link.remove();

          };


        box.appendChild(
          image
        );

        box.appendChild(
          title
        );

        box.appendChild(
          download
        );

        hdResults.appendChild(
          box
        );

      });


    hdCard.style.display =
      "block";

    paymentCard.style.display =
      "none";


    setStatus(
      "🎉 Your 4 HD sketches are ready!"
    );


    hdCard.scrollIntoView({
      behavior: "smooth"
    });


  } catch (error) {

    console.error(error);

    payBtn.disabled =
      false;

    setStatus(
      error?.message ||
      "HD generation failed.",
      true
    );

  }

}


/*
  One HD request.
*/
async function generateHD(
  styleIndex,
  payment
) {

  const form =
    new FormData();

  form.append(
    "photo",
    resizedPhoto,
    "photo.jpg"
  );

  form.append(
    "style",
    String(styleIndex)
  );

  form.append(
    "sessionId",
    sessionId
  );

  form.append(
    "photoHash",
    photoHash
  );

  form.append(
    "razorpay_order_id",
    payment.razorpay_order_id
  );

  form.append(
    "razorpay_payment_id",
    payment.razorpay_payment_id
  );

  form.append(
    "razorpay_signature",
    payment.razorpay_signature
  );


  const response =
    await fetch(
      API_URL +
      "/api/verify-payment-one",
      {
        method: "POST",
        body: form
      }
    );


  const data =
    await response.json();


  if (
    !response.ok ||
    !data.success
  ) {

    throw new Error(
      data.error ||
      "Payment verification failed."
    );

  }


  return {
    style:
      styleIndex,

    name:
      data.name,

    image:
      data.image
  };

}


/* Prevent image dragging */
document.addEventListener(
  "dragstart",
  event => {

    if (
      event.target.tagName ===
      "IMG"
    ) {
      event.preventDefault();
    }

  }
);

</script>

</body>
</html>
