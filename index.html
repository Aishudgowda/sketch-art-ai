<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sketch Art AI</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  color:#111
}
header{
  background:#111;
  color:#fff;
  text-align:center;
  padding:24px 15px
}
header h1{
  margin:0 0 8px;
  font-size:30px
}
header p{
  margin:0;
  color:#ccc
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px
}
.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.08)
}
h2{
  margin-top:0
}
.upload{
  border:2px dashed #999;
  padding:25px;
  text-align:center;
  border-radius:14px
}
input[type=file]{
  width:100%;
  padding:12px
}
#preview{
  display:none;
  width:100%;
  max-width:300px;
  max-height:300px;
  object-fit:contain;
  margin:20px auto 0;
  border-radius:12px
}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px
}
button:disabled{
  opacity:.5;
  cursor:not-allowed
}
.status{
  text-align:center;
  margin:15px 0;
  font-weight:bold
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px
}
.result{
  background:#fff;
  border-radius:12px;
  padding:10px;
  box-shadow:0 3px 12px rgba(0,0,0,.08)
}
.result img{
  width:100%;
  display:block;
  border-radius:8px
}
.download{
  display:block;
  text-align:center;
  background:#111;
  color:#fff;
  text-decoration:none;
  padding:11px;
  border-radius:8px;
  margin-top:8px
}
.price{
  font-size:34px;
  font-weight:bold;
  text-align:center;
  margin:15px 0
}
#paymentCard{
  display:none
}
footer{
  text-align:center;
  padding:25px;
  color:#777
}
@media(max-width:600px){
  .grid{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>
  <h1>✏️ Sketch Art AI</h1>
  <p>Turn your photo into professional AI sketch art</p>
</header>

<div class="container">

  <div class="card">

    <h2>📸 Upload Your Photo</h2>

    <div class="upload">

      <input
        type="file"
        id="photoInput"
        accept="image/*"
      >

      <img
        id="preview"
        alt="Photo preview"
      >

    </div>

    <button id="generateBtn">
      ✨ Generate 4 Sketches
    </button>

    <div
      id="status"
      class="status"
    ></div>

  </div>


  <div
    id="resultsCard"
    class="card"
    style="display:none"
  >

    <h2>🎨 Your Sketches</h2>

    <div
      id="results"
      class="grid"
    ></div>

  </div>


  <div
    id="paymentCard"
    class="card"
  >

    <h2>🔓 Unlock HD Downloads</h2>

    <p>Your 4 previews are ready.</p>

    <div class="price">₹99</div>

    <p>
      Pay ₹99 to unlock and download all 4 HD sketches.
    </p>

    <button id="payBtn">
      💳 Pay ₹99 & Unlock HD
    </button>

  </div>


  <div
    id="hdCard"
    class="card"
    style="display:none"
  >

    <h2>⬇️ Your HD Sketches</h2>

    <div
      id="hdResults"
      class="grid"
    ></div>

  </div>

</div>

<footer>
  © 2026 Sketch Art AI
</footer>


<script>

const API_URL =
  "https://sketch-art-ai-api.aishudgowda2004.workers.dev";


let resizedPhoto = null;
let sessionId = null;
let photoHash = null;


const photoInput =
  document.getElementById("photoInput");

const preview =
  document.getElementById("preview");

const generateBtn =
  document.getElementById("generateBtn");

const payBtn =
  document.getElementById("payBtn");

const status =
  document.getElementById("status");

const resultsCard =
  document.getElementById("resultsCard");

const results =
  document.getElementById("results");

const paymentCard =
  document.getElementById("paymentCard");

const hdCard =
  document.getElementById("hdCard");

const hdResults =
  document.getElementById("hdResults");


function setStatus(message){
  status.textContent = message;
}


function makeSessionId(){

  if(window.crypto && crypto.randomUUID){
    return crypto.randomUUID();
  }

  return (
    Date.now().toString(36) +
    Math.random().toString(36).slice(2)
  );

}


async function hashFile(file){

  const buffer =
    await file.arrayBuffer();

  const hash =
    await crypto.subtle.digest(
      "SHA-256",
      buffer
    );

  return Array.from(
    new Uint8Array(hash)
  )
  .map(
    b => b.toString(16).padStart(2,"0")
  )
  .join("");

}


async function resizePhoto(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload = () => {

      const img =
        new Image();

      img.onload = () => {

        const maxSize = 480;

        let width =
          img.width;

        let height =
          img.height;

        const scale =
          Math.min(
            1,
            maxSize /
            Math.max(width,height)
          );

        width =
          Math.round(width * scale);

        height =
          Math.round(height * scale);

        const canvas =
          document.createElement("canvas");

        canvas.width =
          width;

        canvas.height =
          height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        canvas.toBlob(
          blob => {

            if(!blob){
              reject(
                new Error(
                  "Could not resize photo."
                )
              );
              return;
            }

            resolve(
              new File(
                [blob],
                "photo.jpg",
                {
                  type:"image/jpeg"
                }
              )
            );

          },
          "image/jpeg",
          0.85
        );

      };

      img.onerror = () =>
        reject(
          new Error(
            "Could not read image."
          )
        );

      img.src =
        reader.result;

    };

    reader.onerror = () =>
      reject(
        new Error(
          "Could not read photo."
        )
      );

    reader.readAsDataURL(file);

  });

}


photoInput.addEventListener(
  "change",
  async () => {

    const file =
      photoInput.files[0];

    if(!file){
      return;
    }

    if(!file.type.startsWith("image/")){
      setStatus(
        "Please select an image."
      );
      return;
    }

    try{

      preview.src =
        URL.createObjectURL(file);

      preview.style.display =
        "block";

      setStatus(
        "Preparing your photo..."
      );

      resizedPhoto =
        await resizePhoto(file);

      photoHash =
        await hashFile(resizedPhoto);

      sessionId =
        makeSessionId();

      setStatus(
        "Photo ready. Tap Generate."
      );

    }catch(error){

      console.error(error);

      setStatus(
        error.message ||
        "Could not prepare photo."
      );

    }

  }
);


generateBtn.addEventListener(
  "click",
  async () => {

    if(!resizedPhoto){

      setStatus(
        "Please upload a photo first."
      );

      return;
    }

    try{

      generateBtn.disabled =
        true;

      paymentCard.style.display =
        "none";

      hdCard.style.display =
        "none";

      resultsCard.style.display =
        "block";

      results.innerHTML =
        "";

      setStatus(
        "Creating 4 AI sketches..."
      );


      const form =
        new FormData();

      form.append(
        "photo",
        resizedPhoto,
        "photo.jpg"
      );

      form.append(
        "sessionId",
        sessionId
      );


      const response =
        await fetch(
          API_URL +
          "/api/generate",
          {
            method:"POST",
            body:form
          }
        );


      let data;

      try{
        data =
          await response.json();
      }catch{
        throw new Error(
          "Server returned an invalid response."
        );
      }


      if(
        !response.ok ||
        !data.success
      ){

        throw new Error(
          data.error ||
          "Image generation failed."
        );

      }


      if(
        !Array.isArray(data.images) ||
        data.images.length === 0
      ){

        throw new Error(
          "No images were returned."
        );

      }


      data.images.forEach(
        (image,index)=>{

          const box =
            document.createElement("div");

          box.className =
            "result";

          const img =
            document.createElement("img");

          img.src =
            image;

          img.alt =
            "AI Sketch " +
            (index + 1);

          box.appendChild(img);

          results.appendChild(box);

        }
      );


      paymentCard.style.display =
        "block";

      setStatus(
        "✅ 4 previews are ready. Unlock HD for ₹99."
      );


    }catch(error){

      console.error(error);

      setStatus(
        "❌ " +
        (
          error.message ||
          "Something went wrong."
        )
      );

    }finally{

      generateBtn.disabled =
        false;

    }

  }
);


payBtn.addEventListener(
  "click",
  async () => {

    try{

      payBtn.disabled =
        true;

      setStatus(
        "Opening secure payment..."
      );


      const response =
        await fetch(
          API_URL +
          "/api/create-order",
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/json"
            },
            body:JSON.stringify({
              sessionId,
              photoHash
            })
          }
        );


      let data;

      try{
        data =
          await response.json();
      }catch{
        throw new Error(
          "Invalid payment response."
        );
      }


      if(
        !response.ok ||
        !data.success
      ){

        throw new Error(
          data.error ||
          "Could not create payment order."
        );

      }


      if(
        typeof Razorpay ===
        "undefined"
      ){

        throw new Error(
          "Razorpay could not load. Please refresh."
        );

      }


      const options = {

        key:
          data.keyId,

        amount:
          data.amount,

        currency:
          data.currency,

        name:
          "Sketch Art AI",

        description:
          "Unlock 4 HD AI Sketches",

        order_id:
          data.orderId,

        handler:
          async function(payment){

            await verifyPayment(
              payment
            );

          },

        modal:{
          ondismiss:
            function(){

              payBtn.disabled =
                false;

              setStatus(
                "Payment cancelled."
              );

            }
        }

      };


      const razorpay =
        new Razorpay(options);

      razorpay.open();


    }catch(error){

      console.error(error);

      payBtn.disabled =
        false;

      setStatus(
        "❌ " +
        (
          error.message ||
          "Payment failed."
        )
      );

    }

  }
);


async function verifyPayment(
  payment
){

  try{

    setStatus(
      "Payment successful. Creating HD sketches..."
    );


    const form =
      new FormData();

    form.append(
      "razorpay_order_id",
      payment.razorpay_order_id
    );

    form.append(
      "razorpay_payment_id",
      payment.razorpay_payment_id
    );

    form.append(
      "razorpay_signature",
      payment.razorpay_signature
    );

    form.append(
      "sessionId",
      sessionId
    );

    form.append(
      "photoHash",
      photoHash
    );

    form.append(
      "photo",
      resizedPhoto,
      "photo.jpg"
    );


    const response =
      await fetch(
        API_URL +
        "/api/verify-payment",
        {
          method:"POST",
          body:form
        }
      );


    let data;

    try{
      data =
        await response.json();
    }catch{
      throw new Error(
        "Invalid server response."
      );
    }


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "Payment verification failed."
      );

    }


    if(
      !Array.isArray(data.images)
    ){

      throw new Error(
        "HD images were not returned."
      );

    }


    hdResults.innerHTML =
      "";

    data.images.forEach(
      (image,index)=>{

        const box =
          document.createElement("div");

        box.className =
          "result";


        const img =
          document.createElement("img");

        img.src =
          image;

        img.alt =
          "HD Sketch " +
          (index + 1);


        const download =
          document.createElement("a");

        download.className =
          "download";

        download.textContent =
          "⬇️ Download HD";

        download.href =
          image;

        download.download =
          "sketch-art-" +
          (index + 1) +
          ".png";


        box.appendChild(img);

        box.appendChild(
          download
        );

        hdResults.appendChild(
          box
        );

      }
    );


    hdCard.style.display =
      "block";

    paymentCard.style.display =
      "none";

    setStatus(
      "✅ Done! Your 4 HD sketches are ready."
    );


    hdCard.scrollIntoView({
      behavior:"smooth"
    });


  }catch(error){

    console.error(error);

    payBtn.disabled =
      false;

    setStatus(
      "❌ " +
      (
        error.message ||
        "HD generation failed."
      )
    );

  }

}

</script>

</body>
</html>
