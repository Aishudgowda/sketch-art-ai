<title>Sketch Art AI</title>

<style>
* {

}

body {
  margin: 0;
  font-family: Arial, sans-serif;

}

header {

.upload-box {

}

#photoInput {
  display: block;
  width: 100%;
  max-width: 400px;

}

#preview {
  display: none;

}

#generateBtn:disabled {
  background: #999;
}

#status {
  margin-top: 20px;
  font-weight: bold;
}

.results {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-top: 25px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

.card img {
  width: 100%;
  border-radius: 12px;
}

.download-btn {
  width: 100%;

  border-radius: 10px;
  padding: 12px;
  background: #e5e5e5;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}
</style>
</head>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
    >

    <img
      id="preview"

    >

    <button

      type="button"
    >
      ✨ Generate 4 Sketches
    </button>

    <div id="status"></div>

  </div>

  <div
    id="results"
    class="results"
  ></div>

</div>

<footer>
  © 2026 Sketch Art AI
</footer>
