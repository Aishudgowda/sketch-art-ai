<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>Sketch Art AI</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #000;
      color: white;
      text-align: center;
      padding: 24px 16px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #ccc;
    }

    .container {
      width: min(100% - 28px, 900px);
      margin: 25px auto 50px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    .upload-box {
      border: 2px dashed #aaa;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
    }

    input[type="file"] {
      width: 100%;
      margin-top: 15px;
    }

    #preview {
      display: none;
      width: min(100%, 300px);
      max-height: 350px;
      object-fit: contain;
      margin: 20px auto 0;
      border-radius: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #generateBtn {
      width: 100%;
      margin-top: 20px;
      background: #000;
      color: white;
    }

    #generateBtn:disabled,
    #payBtn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
      min-height: 24px;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .result {
      background: #fafafa;
      border-radius: 15px;
      padding: 12px;
      text-align: center;
      border: 1px solid #ddd;
    }

    .result img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .result h3 {
      font-size: 16px;
      margin: 12px 0 6px;
    }

    .locked {
      font-size: 13px;
      color: #777;
    }

    .payment {
      display: none;
      text-align: center;
      border: 2px solid #111;
    }

    .payment h2 {
      margin-top: 0;
    }

    .price {
      font-size: 30px;
      font-weight: bold;
      margin: 10px 0 18px;
    }

    #payBtn {
      background: #111;
      color: white;
      width: 100%;
      max-width: 400px;
    }

    .hd {
      display: none;
    }

    .download {
      width: 100%;
      margin-top: 10px;
      background: #111;
      color: white;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 25px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 23px;
      }

      .results {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>✏️ Sketch Art AI</h1>
  <p>Turn your photo into professional AI sketch art</p>
</header>

<div class="container">

  <div class="card">

    <div class="upload-box">
      <h2>Upload Your Photo</h2>
      <p>Use one clear face photo for the best result.</p>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
      >

      <img id="preview" alt="Photo preview">
    </div>

    <button id="generateBtn">
      ✨ Generate 4 Sketches
    </button>

    <div id="status"></div>

  </div>


  <div id="resultsCard" class="card" style="display:none;">

    <h2>🎨 Your Sketches</h2>

    <div id="results" class="results"></div>

  </div>


  <div id="paymentCard" class="card payment">

    <h2>🔓 Unlock HD Downloads</h2>

    <p>
      Your 4 previews are ready.
    </p>

    <div class="price">₹99</div>

    <p>
      Pay ₹99 to generate and download all 4 HD sketches.
    </p>

    <button id="payBtn">
      💳 Pay ₹99 & Unlock HD
    </button>

  </div>


  <div id="hdCard" class="card hd">

    <h2>✨ Your HD Sketches</h2>

    <div id="hdResults" class="results"></div>

  </div>

</div>

<footer>
  © 2026 Sketch Art AI
</footer>


<script>

const API_URL =
  "https://sketch-art-ai-api.aishudgowda2004.workers.dev";


const photoInput =
  document.getElementById("photoInput");

const preview =
  document.getElementById("preview");

const generateBtn =
  document.getElementById("generateBtn");

const payBtn =
  document.getElementById("payBtn");

const statusBox =
  document.getElementById("status");

const resultsCard =
  document.getElementById("resultsCard");

const results =
  document.getElementById("results");

const paymentCard =
  document.getElementById("paymentCard");

const hdCard =
  document.getElementById("hdCard");

const hdResults =
  document.getElementById("hdResults");


let resizedPhoto = null;
let sessionId = null;
let photoHash = null;


function setStatus(message, error = false) {
  statusBox.textContent = message;
  statusBox.style.color = error ? "#d00" : "#111";
}


/*
  Resize the uploaded photo to maximum 510px.
  Cloudflare FLUX.2 klein reference images must be
  smaller than 512 x 512.
*/
async function resizePhoto(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => {

      const img = new Image();

      img.onload = () => {

        const maxSize = 510;

        let width = img.width;
        let height = img.height;

        const scale =
          Math.min(1, maxSize / Math.max(width, height));

        width = Math.round(width * scale);
        height = Math.round(height * scale);

        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        canvas.toBlob(
          blob => {

            if (!blob) {
              reject(
                new Error("Photo processing failed.")
              );
              return;
            }

            resolve(
              new File(
                [blob],
                "photo.jpg",
                {
                  type: "image/jpeg"
                }
              )
            );

          },
          "image/jpeg",
          0.90
        );

      };

      img.onerror = () => {
        reject(
          new Error("Could not read the photo.")
        );
      };

      img.src = reader.result;
    };

    reader.onerror = () => {
      reject(
        new Error("Could not load the photo.")
      );
    };

    reader.readAsDataURL(file);
  });
}


/* Photo preview */
photoInput.addEventListener("change", async () => {

  const file = photoInput.files[0];

  if (!file) {
    preview.style.display = "none";
    return;
  }

  if (!file.type.startsWith("image/")) {
    setStatus(
      "Please select an image.",
      true
    );
    return;
  }

  preview.src =
    URL.createObjectURL(file);

  preview.style.display = "block";

  setStatus("");
});


/* Generate 4 previews */
generateBtn.addEventListener("click", async () => {

  const file =
    photoInput.files[0];

  if (!file) {

    setStatus(
      "Please upload a photo first.",
      true
    );

    return;
  }

  try {

    generateBtn.disabled = true;

    paymentCard.style.display = "none";
    resultsCard.style.display = "none";
    hdCard.style.display = "none";

    results.innerHTML = "";
    hdResults.innerHTML = "";

    setStatus(
      "Creating your 4 AI sketches..."
    );

    resizedPhoto =
      await resizePhoto(file);


    const form =
      new FormData();

    form.append(
      "photo",
      resizedPhoto,
      "photo.jpg"
    );


    const response =
      await fetch(
        API_URL + "/api/generate",
        {
          method: "POST",
          body: form
        }
      );


    const data =
      await response.json();


    if (!response.ok || !data.success) {

      throw new Error(
        data.error ||
        "Sketch generation failed."
      );

    }


    sessionId =
      data.sessionId;

    photoHash =
      data.photoHash;


    results.innerHTML = "";


    data.images.forEach(item => {

      const box =
        document.createElement("div");

      box.className = "result";

      box.innerHTML = `
        <img
          src="${item.image}"
          alt="${item.name}"
          draggable="false"
        >

        <h3>${item.name}</h3>

        <div class="locked">
          🔒 HD download locked
        </div>
      `;

      results.appendChild(box);

    });


    resultsCard.style.display = "block";

    paymentCard.style.display = "block";

    setStatus(
      "4 sketches created. Pay ₹99 to unlock HD downloads."
    );


  } catch (error) {

    console.error(error);

    setStatus(
      error.message ||
      "Something went wrong.",
      true
    );

  } finally {

    generateBtn.disabled = false;

  }

});


/* Payment */
payBtn.addEventListener("click", async () => {

  if (!sessionId || !photoHash || !resizedPhoto) {

    setStatus(
      "Please generate the sketches again.",
      true
    );

    return;
  }


  try {

    payBtn.disabled = true;

    setStatus(
      "Opening secure payment..."
    );


    /*
      Create Razorpay order
    */
    const orderResponse =
      await fetch(
        API_URL + "/api/create-order",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            sessionId: sessionId,
            photoHash: photoHash
          })
        }
      );


    const orderData =
      await orderResponse.json();


    if (
      !orderResponse.ok ||
      !orderData.success
    ) {

      throw new Error(
        orderData.error ||
        "Could not create payment order."
      );

    }


    if (
      typeof Razorpay === "undefined"
    ) {

      throw new Error(
        "Payment system could not load. Please try again."
      );

    }


    const options = {

      key: orderData.keyId,

      amount: orderData.amount,

      currency: orderData.currency,

      name: "Sketch Art AI",

      description:
        "Unlock 4 HD AI Sketches",

      order_id:
        orderData.orderId,

      handler:
        async function(payment) {

          await verifyPayment(payment);

        },

      modal: {

        ondismiss: function() {

          payBtn.disabled = false;

          setStatus(
            "Payment window closed."
          );

        }

      },

      theme: {
        color: "#000000"
      }

    };


    const razorpay =
      new Razorpay(options);


    razorpay.on(
      "payment.failed",
      function(response) {

        console.error(
          response.error
        );

        payBtn.disabled = false;

        setStatus(
          response.error?.description ||
          "Payment failed. Please try again.",
          true
        );

      }
    );


    razorpay.open();


  } catch (error) {

    console.error(error);

    payBtn.disabled = false;

    setStatus(
      error.message ||
      "Payment could not start.",
      true
    );

  }

});


/*
  Verify payment and generate HD images
*/
async function verifyPayment(payment) {

  try {

    setStatus(
      "Payment successful. Verifying and creating HD sketches..."
    );


    const form =
      new FormData();


    form.append(
      "sessionId",
      sessionId
    );

    form.append(
      "photoHash",
      photoHash
    );

    form.append(
      "razorpay_order_id",
      payment.razorpay_order_id
    );

    form.append(
      "razorpay_payment_id",
      payment.razorpay_payment_id
    );

    form.append(
      "razorpay_signature",
      payment.razorpay_signature
    );

    form.append(
      "photo",
      resizedPhoto,
      "photo.jpg"
    );


    const response =
      await fetch(
        API_URL + "/api/verify-payment",
        {
          method: "POST",
          body: form
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "Payment verification failed."
      );

    }


    hdResults.innerHTML = "";


    data.images.forEach(item => {

      const box =
        document.createElement("div");

      box.className = "result";


      const image =
        document.createElement("img");

      image.src =
        item.image;

      image.alt =
        item.name;

      image.draggable = false;


      const title =
        document.createElement("h3");

      title.textContent =
        item.name;


      const button =
        document.createElement("button");

      button.className =
        "download";

      button.textContent =
        "⬇️ Download HD";


      button.addEventListener(
        "click",
        () => {

          const link =
            document.createElement("a");

          link.href =
            item.image;

          link.download =
            "sketch-art-ai-" +
            item.name
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-") +
            ".png";

          document.body.appendChild(link);

          link.click();

          link.remove();

        }
      );


      box.appendChild(image);
      box.appendChild(title);
      box.appendChild(button);

      hdResults.appendChild(box);

    });


    hdCard.style.display =
      "block";

    paymentCard.style.display =
      "none";


    setStatus(
      "✅ Payment verified! Your 4 HD sketches are ready."
    );


    hdCard.scrollIntoView({
      behavior: "smooth"
    });


  } catch (error) {

    console.error(error);

    payBtn.disabled = false;

    setStatus(
      error.message ||
      "Payment verification failed.",
      true
    );

  }

}


/* Prevent accidental image dragging */
document.addEventListener(
  "dragstart",
  event => {

    if (
      event.target.tagName === "IMG"
    ) {
      event.preventDefault();
    }

  }
);

</script>

</body>
</html>
